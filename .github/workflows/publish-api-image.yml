name: Publish API image

# Builds the Explore API image (packages/api/Dockerfile — sdk → api → web) and
# pushes it to GHCR so the evm-explorer box deploys a PINNED, pullable artifact
# instead of hand-building on the box. The hand-build path is what let prod
# drift behind main (address-page transactions returned empty against a stale
# image while main served them correctly). With this, a deploy is:
#   TRACE_IMAGE=ghcr.io/valve-tech/explore-api:sha-<commit>  +  valve deploy --env rpc-otterscan
on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/sdk/**"
      - "packages/web/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-api-image.yml"
  workflow_dispatch: {}

concurrency:
  group: publish-api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/valve-tech/explore-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
